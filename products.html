<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-3">Manage Products</h2>

    <!-- ADD PRODUCT -->
    <div class="card mb-4">
        <div class="card-body">
            <h5>Add Product</h5>
            <form action="/add_product" method="post" class="row g-2">
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Product Name" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="price" class="form-control" placeholder="Price" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="qty" class="form-control" placeholder="Quantity" required>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-success w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PRODUCT TABLE -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>
        {% for p in products %}
        <tr>
            <form action="/update_product/{{ p[0] }}" method="post">
                <td>{{ p[0] }}</td>
                <td>
                    <input type="text" name="name" value="{{ p[1] }}" class="form-control">
                </td>
                <td>
                    <input type="number" name="price" value="{{ p[2] }}" class="form-control">
                </td>
                <td>
                    <input type="number" name="quantity" value="{{ p[3] }}" class="form-control">
                </td>
                <td>
                    <button class="btn btn-primary btn-sm">Update</button>
                </td>
            </form>
            <td>
                <a href="/delete_product/{{ p[0] }}"
                   onclick="return confirm('Are you sure?')"
                   class="btn btn-danger btn-sm">
                   Delete
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="/dashboard" class="btn btn-secondary">Back</a>
</div>

</body>
</html>
